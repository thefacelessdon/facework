version: "1.7.0"
tenant: "face.works"
runtime: "claude-code"   # Claude Code / Agent SDK — the fourth reference runtime

# How each of the four Runtime Ports binds to Claude Code, from the end-to-end
# run (methodology/runtime-ports-claude-code-gap-2026-08-05.md). native = the
# runtime hosts it directly; partial = hosted with gaps; authoring_side = stays
# in the Facework manifest, not hosted by the runtime.
port_bindings:
  - port: context
    status: native
    mechanism: "claude-code:CLAUDE.md-hierarchy + .claude/rules"
    notes: "Declarative composition at session start; soul/identity/purpose compose into CLAUDE.md."
  - port: connections
    status: native
    mechanism: "claude-code:.mcp.json + .claude/settings.json permissions"
    notes: "MCP servers + allow/ask/deny rules. Endpoints/secrets filled by operator; never in the bundle."
  - port: skills
    status: partial
    mechanism: "claude-code:.claude/skills + hooks + routines"
    notes: "on_demand + scheduled (routines) + event (hooks) = 3/4 triggers; no native continuous."
  - port: memory
    status: partial
    mechanism: "claude-code:CLAUDE.md + auto-memory (~/.claude/projects/<p>/memory)"
    notes: "File + grep retrieval; no semantic index and no tenant/agent boundary primitive."

# Sovereignty decomposed by layer (§9.12, FS-400.7). Claude Code is the
# own-harness + own-state + rent-model shape.
shell_sovereignty:
  harness: own      # open Agent SDK, runs as a local subprocess in the tenant's infra
  state: own        # CLAUDE.md, .claude/, transcripts, auto-memory — all on local disk, portable
  model: rent       # Claude models are Anthropic-hosted and closed, called via API
  waiver:
    layers: [model]
    exit_plan: >
      Harness and all state are local and portable — relocate .claude/ +
      ~/.claude/projects/<p>/ + the repo to new infra and repoint ANTHROPIC_API_KEY.
      Only the model layer exits the tenant's control; no state or harness lock-in.
    data_posture:
      retention: "per Anthropic commercial terms; no tenant state persisted server-side beyond a request"
      training: "off (API data not used for training under commercial terms)"
      residency: "n/a for local state; model calls per Anthropic terms"
    # v1.7.0 — structured so the Phase-7 gate is machine-checkable (§9.12).
    ruling:
      status: ruled
      by: "Harper (harper@face.works)"
      date: "2026-08-05"
      note: "Model-layer rent accepted; harness and state remain sovereign."

# Governance attributes split into enforceable gates vs descriptive metadata
# (§9.12, FS-400.4). gate + binds_to = the runtime enforces it; gate + unenforced
# = declared, delegated to the authoring layer / human (NOT a gate failure).
governance:
  - attribute: escalation
    kind: gate
    binds_to: "claude-code:permissions (ask mode)"
  - attribute: verifier_skill_id
    kind: gate
    unenforced: true   # Claude Code has no native "verifier gates output before publish"; the design-eye-evaluator skill runs as a delegated authoring-layer step
  - attribute: trust_boundary
    kind: metadata
  - attribute: pii
    kind: metadata
  - attribute: data_residency
    kind: metadata
  - attribute: rate_limits
    kind: metadata
  - attribute: sponsors
    kind: metadata
