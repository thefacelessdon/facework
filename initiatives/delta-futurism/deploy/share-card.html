<!doctype html>
<!-- Link-preview card template (1200x630), rendered by make-share-cards.sh with headless Chrome.
     Query: ?img=<file in img/>&name=<wordmark>&tag=<small label>. Words live in og:title/og:description;
     the card carries the photo and the name only (same pattern as HUE's share cards). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../examples/face.works/prototype/public/delta-futurism/fonts/fonts.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1d1f33}
.ph{position:absolute;inset:0 0 104px 0;background-size:cover;background-position:center}
.band{position:absolute;left:0;right:0;bottom:0;height:104px;background:#1d1f33;display:flex;align-items:center;justify-content:space-between;padding:0 56px;color:#f4f1ea}
.n{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:44px;letter-spacing:-.01em}
.n span{color:#e2733f}
.t{font-family:"Libre Franklin",Helvetica,sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#c9c3b6}
</style></head><body>
<div class="ph" id="ph"></div>
<div class="band"><div class="n" id="n"></div><div class="t" id="t"></div></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('ph').style.backgroundImage='url(../../../examples/face.works/prototype/public/delta-futurism/img/'+q.get('img')+')';
document.getElementById('n').innerHTML=q.get('name');
document.getElementById('t').textContent=q.get('tag');
</script></body></html>
