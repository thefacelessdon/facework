<text x="120" y="98" class="mono" font-size="19" letter-spacing="2" fill="#A49D90">FACEWORK / EVIDENCE FIELD</text>
<text x="72" y="258" class="serif" font-size="64" font-weight="520" letter-spacing="-1" fill="#ECE9E1"><tspan x="72">What changes when</tspan><tspan x="72" dy="74">lineage is visible?</tspan></text>
<line x1="72" y1="420" x2="1008" y2="420" stroke="#5FB5AA" stroke-width="6"/>
<text x="72" y="486" class="mono" font-size="18" letter-spacing="1.5" fill="#5FB5AA">01 / OBSERVED</text><text x="72" y="540" class="serif" font-size="31" fill="#ECE9E1"><tspan x="72">Decisions disappear inside polished</tspan><tspan x="72" dy="42">deliverables.</tspan></text>
<line x1="72" y1="626" x2="1008" y2="626" stroke="#3A362F" stroke-width="2"/>
<text x="72" y="692" class="mono" font-size="18" letter-spacing="1.5" fill="#A49D90">02 / TESTING</text><text x="72" y="746" class="serif" font-size="31" fill="#ECE9E1"><tspan x="72">Place status, source, and dependency</tspan><tspan x="72" dy="42">at the point of use.</tspan></text>
<line x1="72" y1="832" x2="1008" y2="832" stroke="#3A362F" stroke-width="2"/>
<text x="72" y="898" class="mono" font-size="18" letter-spacing="1.5" fill="#A49D90">03 / LIMIT</text><text x="72" y="952" class="serif" font-size="31" fill="#ECE9E1"><tspan x="72">Transparency cannot replace judgment</tspan><tspan x="72" dy="42">or stewardship.</tspan></text>
<line x1="72" y1="1128" x2="1008" y2="1128" stroke="#3A362F" stroke-width="2"/>
<text x="72" y="1190" class="mono" font-size="18" letter-spacing="1.5" fill="#A49D90">FN-027 / DEVELOPING / 06 AUG 2026</text><text x="72" y="1274" class="serif" font-size="25" fill="#ECE9E1">face.works/notes/027</text>
</svg>
