<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Facework evidence social template</title><desc id="desc">A portrait evidence field keeps an observation, test, and limitation visibly connected.</desc>
  <rect width="1080" height="1350" fill="#11110F"/><text x="72" y="104" font-family="JetBrains Mono,monospace" font-size="19" letter-spacing="2" fill="#9C9890">FACEWORK / EVIDENCE FIELD</text>
  <text x="72" y="254" font-family="Helvetica Neue,Arial,sans-serif" font-size="68" font-weight="500" letter-spacing="-3" fill="#F4F3EE"><tspan x="72">What changes when</tspan><tspan x="72" dy="76">lineage is visible?</tspan></text>
  <line x1="72" y1="420" x2="1008" y2="420" stroke="#8FAFFF" stroke-width="6"/>
  <text x="72" y="486" font-family="JetBrains Mono,monospace" font-size="18" fill="#8FAFFF">01 / OBSERVED</text><text x="72" y="540" font-family="Helvetica Neue,Arial,sans-serif" font-size="31" fill="#F4F3EE"><tspan x="72">Decisions disappear inside polished</tspan><tspan x="72" dy="42">deliverables.</tspan></text>
  <line x1="72" y1="626" x2="1008" y2="626" stroke="#34322D" stroke-width="2"/>
  <text x="72" y="692" font-family="JetBrains Mono,monospace" font-size="18" fill="#9C9890">02 / TESTING</text><text x="72" y="746" font-family="Helvetica Neue,Arial,sans-serif" font-size="31" fill="#F4F3EE"><tspan x="72">Place status, source, and dependency</tspan><tspan x="72" dy="42">at the point of use.</tspan></text>
  <line x1="72" y1="832" x2="1008" y2="832" stroke="#34322D" stroke-width="2"/>
  <text x="72" y="898" font-family="JetBrains Mono,monospace" font-size="18" fill="#9C9890">03 / LIMIT</text><text x="72" y="952" font-family="Helvetica Neue,Arial,sans-serif" font-size="31" fill="#F4F3EE"><tspan x="72">Transparency cannot replace judgment</tspan><tspan x="72" dy="42">or stewardship.</tspan></text>
  <line x1="72" y1="1128" x2="1008" y2="1128" stroke="#34322D" stroke-width="2"/>
  <text x="72" y="1190" font-family="JetBrains Mono,monospace" font-size="18" fill="#9C9890">FN-027 / DEVELOPING / 06 AUG 2026</text><text x="72" y="1274" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" fill="#F4F3EE">face.works/notes/027</text>
</svg>
