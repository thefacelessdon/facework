  <title id="title">Facework sequence social template</title><desc id="desc">A landscape frame shows observation becoming a durable standard through a five-step knowledge path.</desc>
  <rect width="1920" height="1080" fill="#FAFAF8"/><text x="96" y="90" font-family="JetBrains Mono,monospace" font-size="22" letter-spacing="2" fill="#6B6861">FACEWORK / KNOWLEDGE PATH / 03 OF 05</text>
  <text x="96" y="290" font-family="Helvetica Neue,Arial,sans-serif" font-size="92" font-weight="500" letter-spacing="-4" fill="#1A1917"><tspan x="96">Ideas should earn</tspan><tspan x="96" dy="98">permanence.</tspan></text>
  <g transform="translate(96 635)"><line x1="0" y1="0" x2="1728" y2="0" stroke="#1A1917" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="#FAFAF8" stroke="#1A1917" stroke-width="3"/><circle cx="432" cy="0" r="11" fill="#FAFAF8" stroke="#1A1917" stroke-width="3"/><rect x="853" y="-11" width="22" height="22" fill="#8FAFFF" stroke="#1A1917" stroke-width="3"/><circle cx="1296" cy="0" r="11" fill="#FAFAF8" stroke="#1A1917" stroke-width="3"/><circle cx="1728" cy="0" r="11" fill="#FAFAF8" stroke="#1A1917" stroke-width="3"/>
  <g font-family="JetBrains Mono,monospace" font-size="19" fill="#6B6861"><text x="0" y="56">OBSERVATION</text><text x="432" y="56">FIELD NOTE</text><text x="864" y="56" text-anchor="middle" fill="#1A1917">MODEL</text><text x="1296" y="56">FRAMEWORK</text><text x="1728" y="56" text-anchor="end">STANDARD</text></g></g>
  <line x1="96" y1="928" x2="1824" y2="928" stroke="#E5E3DC" stroke-width="2"/><text x="96" y="988" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" fill="#2C2B27">Each transition records what changed, why, and what remains.</text><text x="1824" y="988" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="20" fill="#6B6861">face.works</text>
