<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Facework artifact plaque design intent</title><desc id="desc">A reading-distance plaque identifies Axis Exchange, explains its relationship, and provides a source destination.</desc>
  <rect width="1200" height="800" fill="#F4F3EE"/><line x1="60" y1="60" x2="1140" y2="60" stroke="#1A1917" stroke-width="3"/><text x="60" y="112" font-family="JetBrains Mono,monospace" font-size="20" letter-spacing="1.5" fill="#6B6861">FVI-001 / CANONICAL / 0.1.0</text>
  <text x="60" y="238" font-family="Helvetica Neue,Arial,sans-serif" font-size="68" font-weight="500" letter-spacing="-2" fill="#1A1917">Axis Exchange</text><text x="60" y="318" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" fill="#2C2B27"><tspan x="60">Two fields maintain relationship through an open</tspan><tspan x="60" dy="40">center under tension. The interval is not empty;</tspan><tspan x="60" dy="40">it is the condition that keeps both forces legible.</tspan></text>
  <line x1="60" y1="515" x2="1140" y2="515" stroke="#E5E3DC" stroke-width="3"/><text x="60" y="570" font-family="JetBrains Mono,monospace" font-size="18" fill="#6B6861">DERIVED FROM</text><text x="60" y="618" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" fill="#1A1917">FVS-200 Visual Primitives / FVR-101 Bilateral Systems</text><rect x="60" y="682" width="18" height="18" fill="#8FAFFF" stroke="#1A1917" stroke-width="2"/><text x="96" y="699" font-family="JetBrains Mono,monospace" font-size="18" fill="#1A1917">READ THE FULL RECORD / face.works/fvi-001</text>
</svg>
