<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="title desc">
  <title id="title">Facework Exchange Resolve motion signature</title>
  <desc id="desc">Two counterparts approach a shared open axis and settle into the Facework Coherence Mark. Motion is removed when reduced motion is preferred.</desc>
  <style>
    .left,.right{opacity:.56;transform-box:fill-box;transform-origin:center;animation-duration:520ms;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
    .left{animation-name:left}.right{animation-name:right}.axis{opacity:0;transform-box:fill-box;transform-origin:center;animation:axis 520ms linear both}
    @keyframes left{from{opacity:.56;transform:translateX(-10px)}72%{opacity:1}to{opacity:1;transform:translateX(0)}}
    @keyframes right{from{opacity:.56;transform:translateX(10px)}72%{opacity:1}to{opacity:1;transform:translateX(0)}}
    @keyframes axis{0%,48%{opacity:0;transform:scale(.5)}64%{opacity:.8;transform:scale(1)}82%,100%{opacity:0;transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){.left,.right,.axis{animation:none;opacity:1;transform:none}.axis{opacity:0}}
  </style>
  <g fill="currentColor">
    <g class="left"><path d="M8 13C44 18 78 29 109 45V58C76 42 42 32 9 28Z"/><path d="M14 44C48 50 81 62 109 77V90C78 75 48 64 19 59Z"/><path d="M27 76C57 83 84 95 109 109V123C81 107 57 97 36 92Z"/><path d="M18 146C55 134 84 118 109 98V114C81 136 51 152 13 159Z"/></g>
    <g class="right"><g transform="translate(240) scale(-1 1)"><path d="M8 13C44 18 78 29 109 45V58C76 42 42 32 9 28Z"/><path d="M14 44C48 50 81 62 109 77V90C78 75 48 64 19 59Z"/><path d="M27 76C57 83 84 95 109 109V123C81 107 57 97 36 92Z"/><path d="M18 146C55 134 84 118 109 98V114C81 136 51 152 13 159Z"/></g></g>
    <circle class="axis" cx="120" cy="104" r="5" fill="#62DFAE"/>
  </g>
</svg>
