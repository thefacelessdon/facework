<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FVI-400 — Exchange Resolve Reference</title>
  <link rel="stylesheet" href="exchange-resolve.css">
  <style>
    :root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#11110f;color:#f4f3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}.frame{width:min(960px,100%);border:1px solid #34322d;padding:clamp(24px,6vw,72px);background:#1a1917}.meta{color:#9c9890;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.stage{display:grid;place-items:center;min-height:360px;color:#f4f3ee}.mark{width:min(420px,75vw);height:auto}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid #34322d;padding-top:20px}button{min-height:44px;border:1px solid #f4f3ee;background:transparent;color:inherit;padding:10px 18px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid oklch(0.740 0.085 190);outline-offset:3px}.note{color:#9c9890;font-size:13px;line-height:1.5;max-width:62ch}@media(prefers-reduced-motion:reduce){.motion-status::after{content:"Reduced motion: resolved static state"}}@media(prefers-reduced-motion:no-preference){.motion-status::after{content:"Motion enabled: 520 ms Exchange Resolve"}}
  </style>
</head>
<body>
  <main class="frame">
    <p class="meta">FVI-400 / canonical reference implementation</p>
    <section class="stage" aria-label="Exchange Resolve demonstration">
      <svg id="signature" class="mark" viewBox="0 0 230 176" role="img" aria-labelledby="mark-title mark-desc">
        <title id="mark-title">Facework Coherence Mark</title>
        <desc id="mark-desc">Two counterparts resolve around an open shared axis.</desc>
        <g fill="currentColor"><g class="fw-exchange-resolve__left"><path d="M8 16C46 21 80 31 106 46V57C78 44 44 35 9 31Z"/><path d="M16 47C50 53 82 62 106 76V87C80 74 50 65 21 62Z"/><path d="M28 79C58 85 84 94 106 106V117C82 104 58 96 36 94Z"/><path d="M18 150C58 138 92 120 104 100V112C90 122 56 150 16 160Z"/></g><g class="fw-exchange-resolve__right"><g transform="translate(230) scale(-1 1)"><path d="M8 16C46 21 80 31 106 46V57C78 44 44 35 9 31Z"/><path d="M16 47C50 53 82 62 106 76V87C80 74 50 65 21 62Z"/><path d="M28 79C58 85 84 94 106 106V117C82 104 58 96 36 94Z"/><path d="M18 150C58 138 92 120 104 100V112C90 122 56 150 16 160Z"/></g></g><circle class="fw-exchange-resolve__axis" cx="115" cy="105" r="5" fill="#62DFAE"/></g>
      </svg>
    </section>
    <div class="controls">
      <button id="replay" type="button">Replay signature</button>
      <p class="note motion-status" aria-live="polite"></p>
    </div>
  </main>
  <script>
    const button=document.querySelector('#replay');
    button.addEventListener('click',()=>{
      const signature=document.querySelector('#signature');
      const replacement=signature.cloneNode(true);
      signature.replaceWith(replacement);
    });
  </script>
</body>
</html>
