<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Facework diagram grammar tests</title><desc id="desc">Tests compare conforming labeled relationships with ambiguous crossings, excessive color, and unlabeled arrows.</desc>
  <rect width="1200" height="760" fill="#FAFAF8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><text x="64" y="66" font-size="18" letter-spacing="2" fill="#6B6861">FVI-300 / GRAMMAR TEST</text><text x="64" y="110" font-size="36" fill="#1A1917">Readable relationships are the test.</text></g>
  <g transform="translate(64 170)" font-family="ui-monospace, monospace">
    <g><rect width="520" height="230" fill="#F4F3EE" stroke="#E5E3DC"/><text x="24" y="34" font-size="13" fill="#62DFAE">PASS · LABELED DEPENDENCY</text><rect x="54" y="82" width="72" height="72" fill="none" stroke="#1A1917" stroke-width="2"/><rect x="394" y="82" width="72" height="72" fill="none" stroke="#1A1917" stroke-width="2"/><path d="M126 118H394M382 108L394 118L382 128" stroke="#1A1917" stroke-width="2" fill="none"/><text x="260" y="102" text-anchor="middle" font-size="13" fill="#1A1917">derived from</text><text x="90" y="180" text-anchor="middle" font-size="13" fill="#6B6861">Observation</text><text x="430" y="180" text-anchor="middle" font-size="13" fill="#6B6861">Model</text></g>
    <g transform="translate(552)"><rect width="520" height="230" fill="#F4F3EE" stroke="#E5E3DC"/><text x="24" y="34" font-size="13" fill="#62DFAE">PASS · REDUNDANT STATE</text><circle cx="90" cy="118" r="24" fill="none" stroke="#E66F70" stroke-width="3"/><path d="M76 104L104 132M104 104L76 132" stroke="#E66F70" stroke-width="3"/><text x="138" y="113" font-size="15" fill="#1A1917">Conflict detected</text><text x="138" y="136" font-size="13" fill="#6B6861">color + shape + language</text></g>
    <g transform="translate(0 262)"><rect width="520" height="230" fill="#F4F3EE" stroke="#E5E3DC"/><text x="24" y="34" font-size="13" fill="#E66F70">FAIL · FALSE JUNCTION</text><path d="M80 72L440 184M440 72L80 184" stroke="#1A1917" stroke-width="2"/><circle cx="80" cy="72" r="7"/><circle cx="440" cy="72" r="7"/><circle cx="80" cy="184" r="7"/><circle cx="440" cy="184" r="7"/><text x="260" y="136" text-anchor="middle" font-size="13" fill="#E66F70">does this crossing connect?</text></g>
    <g transform="translate(552 262)"><rect width="520" height="230" fill="#F4F3EE" stroke="#E5E3DC"/><text x="24" y="34" font-size="13" fill="#E66F70">FAIL · COLOR AS DECORATION</text><g><circle cx="90" cy="120" r="24" fill="#8FAFFF"/><rect x="173" y="96" width="48" height="48" fill="#FFD089"/><path d="M304 94L334 146H274Z" fill="#62DFAE"/><path d="M397 96H445V144H397Z" fill="#B69AE8"/></g><text x="260" y="184" text-anchor="middle" font-size="13" fill="#6B6861">four colors · no declared states</text></g>
  </g>
  <text x="64" y="710" font-family="ui-monospace, monospace" font-size="14" fill="#6B6861">Test meaning before styling: labels, terminals, crossings, state redundancy, and monochrome survival.</text>
</svg>
