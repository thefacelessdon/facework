<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Facework symbol library</title><desc id="desc">Seven canonical symbols show observation, artifact, boundary, connection, dependency, exchange, and transformation.</desc>
  <rect width="1200" height="680" fill="#FAFAF8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><text x="64" y="68" font-size="18" letter-spacing="2" fill="#6B6861">FVI-300 / SYMBOL LIBRARY</text><text x="64" y="112" font-size="36" fill="#1A1917">A small grammar for visible relationships.</text><text x="64" y="148" font-size="15" fill="#6B6861">24-unit construction · 1.5-unit stroke · one declared meaning per symbol</text></g>
  <g transform="translate(64 210)" fill="#1A1917" font-family="ui-monospace, monospace">
    <g><rect width="248" height="170" fill="#F4F3EE" stroke="#E5E3DC"/><g transform="translate(88 28) scale(3)"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.25"/></g><text x="20" y="142" font-size="15">OBSERVATION</text><text x="20" y="160" font-size="12" fill="#6B6861">recorded condition</text></g>
    <g transform="translate(272)"><rect width="248" height="170" fill="#F4F3EE" stroke="#E5E3DC"/><g transform="translate(88 28) scale(3)"><path d="M4 4H20V20H4ZM8 8H16" fill="none" stroke="currentColor" stroke-width="1.5"/></g><text x="20" y="142" font-size="15">ARTIFACT</text><text x="20" y="160" font-size="12" fill="#6B6861">durable knowledge object</text></g>
    <g transform="translate(544)"><rect width="248" height="170" fill="#F4F3EE" stroke="#E5E3DC"/><g transform="translate(88 28) scale(3)"><path d="M9 4H4V9M15 4H20V9M20 15V20H15M9 20H4V15" fill="none" stroke="currentColor" stroke-width="1.5"/></g><text x="20" y="142" font-size="15">BOUNDARY</text><text x="20" y="160" font-size="12" fill="#6B6861">declared scope</text></g>
    <g transform="translate(816)"><rect width="248" height="170" fill="#F4F3EE" stroke="#E5E3DC"/><g transform="translate(88 28) scale(3)"><path d="M5 12H19" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></g><text x="20" y="142" font-size="15">CONNECTION</text><text x="20" y="160" font-size="12" fill="#6B6861">known relationship</text></g>
    <g transform="translate(136 202)"><rect width="248" height="170" fill="#F4F3EE" stroke="#E5E3DC"/><g transform="translate(88 28) scale(3)"><path d="M5 12H19M15 8L19 12L15 16" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="12" r="2"/></g><text x="20" y="142" font-size="15">DEPENDENCY</text><text x="20" y="160" font-size="12" fill="#6B6861">one-way consequence</text></g>
    <g transform="translate(408 202)"><rect width="248" height="170" fill="#F4F3EE" stroke="#E5E3DC"/><g transform="translate(88 28) scale(3)"><path d="M5 8H19M15 4L19 8L15 12M19 16H5M9 12L5 16L9 20" fill="none" stroke="currentColor" stroke-width="1.5"/></g><text x="20" y="142" font-size="15">EXCHANGE</text><text x="20" y="160" font-size="12" fill="#6B6861">reciprocal transfer</text></g>
    <g transform="translate(680 202)"><rect width="248" height="170" fill="#F4F3EE" stroke="#E5E3DC"/><g transform="translate(88 28) scale(3)"><path d="M8 5H4V19H8M16 5H20V19H16M8 12H16M13 9L16 12L13 15" fill="none" stroke="currentColor" stroke-width="1.5"/></g><text x="20" y="142" font-size="15">TRANSFORMATION</text><text x="20" y="160" font-size="12" fill="#6B6861">change with lineage</text></g>
  </g>
  <text x="64" y="634" font-family="ui-monospace, monospace" font-size="14" fill="#6B6861">Symbols identify kind. Adjacent labels identify meaning.</text>
</svg>
