<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Facework logotype scale test</title>
  <desc id="desc">Register and the primary signature are compared at descending screen heights.</desc>
  <rect width="1500" height="900" fill="#FAFAF8"/>
  <style>
    .label{font-family:'Berkeley Mono Trial','JetBrains Mono',monospace;font-size:18px;fill:#1A1917;letter-spacing:1px}
    .meta{font-family:'Berkeley Mono Trial','JetBrains Mono',monospace;font-size:13px;fill:#6B6861}
  </style>
  <text x="70" y="64" class="label" font-size="24">FVI-100 / REGISTER / SCALE TEST</text>
  <text x="70" y="92" class="meta">Wordmark and primary lockup at descending production sizes</text>

  <text x="70" y="150" class="meta">WORDMARK</text>
  <image href="../facework-logotype.svg" x="70" y="180" width="840" height="120"/>
  <text x="930" y="250" class="meta">120 PX HIGH</text>
  <image href="../facework-logotype.svg" x="70" y="340" width="560" height="80"/>
  <text x="650" y="390" class="meta">80 PX HIGH</text>
  <image href="../facework-logotype.svg" x="70" y="460" width="350" height="50"/>
  <text x="440" y="492" class="meta">50 PX HIGH</text>
  <image href="../facework-logotype.svg" x="70" y="550" width="224" height="32"/>
  <text x="315" y="572" class="meta">32 PX HIGH</text>
  <image href="../facework-logotype.svg" x="70" y="620" width="168" height="24"/>
  <text x="260" y="638" class="meta">24 PX HIGH</text>
  <image href="../facework-logotype.svg" x="70" y="680" width="126" height="18"/>
  <text x="220" y="695" class="meta">18 PX HIGH / MINIMUM</text>

  <line x1="1020" y1="145" x2="1020" y2="760" stroke="#E5E3DC"/>
  <text x="1060" y="150" class="meta">HORIZONTAL LOCKUP</text>
  <image href="../facework-lockup-horizontal.svg" x="1060" y="190" width="330" height="48"/>
  <text x="1060" y="270" class="meta">48 PX HIGH</text>
  <image href="../facework-lockup-horizontal.svg" x="1060" y="320" width="247.5" height="36"/>
  <text x="1060" y="385" class="meta">36 PX HIGH</text>
  <image href="../facework-lockup-horizontal.svg" x="1060" y="435" width="165" height="24"/>
  <text x="1060" y="490" class="meta">24 PX HIGH / MINIMUM</text>

  <text x="70" y="820" class="meta">Below 18 px wordmark height, use text or micro mark according to context. Do not simplify the letterforms ad hoc.</text>
</svg>
