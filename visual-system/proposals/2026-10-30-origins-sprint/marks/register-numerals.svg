oke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"><path transform="translate(0 0)" d="M34 70V14M34 14L7 52H46"/></g><text x="26" y="104" font-family="monospace" font-size="9" text-anchor="middle" fill="#76706a">4</text></g><g transform="translate(390 30)"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"><path transform="translate(0 0)" d="M42 10H10V37C14 35 19 34 25 34C37 34 45 41 45 52C45 63 37 70 25 70C17 70 11 68 7 64"/></g><text x="26" y="104" font-family="monospace" font-size="9" text-anchor="middle" fill="#76706a">5</text></g><g transform="translate(464 30)"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"><path transform="translate(0 0)" d="M40 13C36 11 31 10 27 10C14 10 7 22 7 44C7 60 14 70 26 70C38 70 45 62 45 52C45 42 38 35 26 35C17 35 10 40 7 46"/></g><text x="26" y="104" font-family="monospace" font-size="9" text-anchor="middle" fill="#76706a">6</text></g><g transform="translate(538 30)"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"><path transform="translate(0 0)" d="M6 10H46L20 70"/></g><text x="26" y="104" font-family="monospace" font-size="9" text-anchor="middle" fill="#76706a">7</text></g><g transform="translate(612 30)"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"><path transform="translate(0 0)" d="M26 39C15 39 9 33 9 25C9 16 16 10 26 10C36 10 43 16 43 25C43 33 37 39 26 39C14 39 7 45 7 55C7 64 15 70 26 70C37 70 45 64 45 55C45 45 38 39 26 39Z"/></g><text x="26" y="104" font-family="monospace" font-size="9" text-anchor="middle" fill="#76706a">8</text></g><g transform="translate(686 30)"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"><path transform="transl